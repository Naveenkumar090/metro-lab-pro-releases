name: Publish Metro Lab Pro Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chunks
        uses: actions/checkout@v4

      - name: Assemble and verify installers
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cat chunks/mac-${VER}-part-*.bin > "out/Metro.Lab.Pro.Setup.dmg"
          cat chunks/win-${VER}-part-*.bin > "out/Metro.Lab.Pro.Setup.exe"
          ls -lh out/
          sha256sum out/Metro.Lab.Pro.Setup.dmg out/Metro.Lab.Pro.Setup.exe

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Metro.Lab.Pro.Setup.dmg out/Metro.Lab.Pro.Setup.exe --clobber
          else
            gh release create "$TAG" out/Metro.Lab.Pro.Setup.dmg out/Metro.Lab.Pro.Setup.exe \
              --title "Metro Lab Pro ${TAG}" \
              --notes "Official Metro Lab Pro ${TAG} desktop installers for macOS Universal (.dmg) and Windows (.exe)." \
              --latest
          fi
